<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bourse Score</title>
  <meta name="description" content="Score d'analyse temporel des actions marocaines, et des actions et ETF américains et français.">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bourse Score">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1>Bourse Score</h1>
    <div id="market-filter" class="seg" role="radiogroup" aria-label="Marché"></div>
    <form id="search" autocomplete="off">
      <input id="ticker" type="search" inputmode="text" spellcheck="false"
             placeholder="Nom ou symbole (ex. IAM, Stellantis)" aria-label="Rechercher une valeur" maxlength="40" required>
      <button type="submit">Analyser</button>
      <ul id="suggest" class="suggest" hidden></ul>
    </form>
    <div id="chips" class="chips" aria-label="Suggestions"></div>
  </header>

  <main>
    <p id="status" class="status" role="status">Entrez un symbole pour obtenir son score.</p>

    <section id="result" hidden>
      <div class="card hero">
        <div class="hero-head">
          <div>
            <h2 id="r-ticker"></h2>
            <p class="name"><span id="r-name"></span> <span id="r-badges"></span></p>
            <p class="muted"><span id="r-price"></span> <span id="r-change"></span> · <span id="r-date"></span></p>
          </div>
          <div id="gauge" class="gauge score-only" role="img" aria-label="Score global"><span id="g-score"></span></div>
        </div>
        <p id="g-verdict" class="verdict score-only"></p>
      </div>

      <div class="card">
        <div class="row">
          <h3>Cours <span id="p-perf" class="perf"></span></h3>
          <div id="range-tabs" class="tabs" role="tablist"></div>
        </div>
        <p id="p-readout" class="readout muted small"></p>
        <canvas id="price-chart" class="interactive" height="240" aria-label="Cours de clôture"></canvas>
        <p class="legend small"><i class="sw sw-close"></i> Clôture <i class="sw sw-sma50"></i> MM50 <i class="sw sw-sma200"></i> MM200</p>
      </div>

      <p id="instrument-notice" class="notice" hidden></p>
      <p id="validation" class="notice score-only" hidden></p>
      <p id="liquidity" class="notice score-only" hidden></p>

      <div id="horizons" class="grid score-only"></div>

      <div class="card score-only">
        <div class="row">
          <h3>Évolution du score</h3>
          <div id="tabs" class="tabs" role="tablist"></div>
        </div>
        <canvas id="chart" height="220"></canvas>
        <p class="muted small">Vert ≥ 65 : favorable · Rouge &lt; 40 : défavorable. Historique recalculé avec les modèles actuels.</p>
      </div>

      <details class="card" id="indicators-card">
        <summary>Indicateurs détaillés</summary>
        <div id="indicators" class="indicators"></div>
      </details>

      <p id="model" class="muted small score-only"></p>
      <p id="disclaimer" class="muted small"></p>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
