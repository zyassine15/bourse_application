name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t bourse-score .
      - name: Smoke test
        run: |
          docker run -d --name app -p 10000:10000 bourse-score
          for i in $(seq 1 20); do curl -fs localhost:10000/health && break || sleep 2; done
          curl -fs localhost:10000/health
          curl -fs localhost:10000/api/model
          curl -fs localhost:10000/api/instruments | grep -q ATW
          curl -fs localhost:10000/api/instruments | grep -q STLAP.PA
          curl -fs localhost:10000/manifest.webmanifest > /dev/null
