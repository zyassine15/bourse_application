name: Retrain

# Entraînement continu : chaque semaine on réentraîne, on backteste, et si le gate qualité
# est passé on ouvre une PR avec les nouveaux artefacts. Le merge déclenche le déploiement Render.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Train (exit code 2 = gate qualité non passé, modèle actuel conservé)
        id: train
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: |
          set +e
          python -m training.train
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ]
      - name: Backtest du score
        run: python -m training.backtest
      - uses: actions/upload-artifact@v4
        with:
          name: mlruns
          path: mlruns
          if-no-files-found: ignore
      - name: Open PR with new artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- models; then echo "Aucun changement"; exit 0; fi
          branch="retrain/$(date +%Y%m%d)"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add models
          git commit -m "chore(model): retrain $(date +%Y-%m-%d)"
          git push -u origin "$branch"
          gh pr create --fill --title "Retrain $(date +%Y-%m-%d)" \
            --body "Réentraînement planifié. Code d'entraînement : ${{ steps.train.outputs.code }} (0 = nouveau modèle publié, 2 = gate non passé). Métriques dans models/metadata.json et models/backtest.json."
